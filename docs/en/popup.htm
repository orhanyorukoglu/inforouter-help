<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="1; url=/en/DocumentVersions/">
<title>Redirecting...</title>
<script>
var params = window.location.search.substring(1) || window.location.hash.substring(1);
var map = {
  'VersionControl': '/en/DocumentVersions/',
  'UserProfile': '/en/UserProfile/',
  'EditingDocuments': '/en/EditingDocuments/',
  'CheckIn': '/en/CheckIn/',
  'CheckOut': '/en/CheckOut/'
};
if (params && map[params]) {
  window.location.replace(map[params]);
} else if (params) {
  window.location.replace('/en/' + params + '/');
}
</script>
</head>
<body>
<p>This page has moved. <a href="/en/DocumentVersions/">Click here</a> if not redirected.</p>
</body>
</html>
